<!doctype html>
<html lang="id"><head><meta charset="utf-8"><title>Logo Cakrawala</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Inter:wght@600&display=block" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:transparent}
  .lockup{display:inline-flex;align-items:center;gap:28px;padding:24px}
  .lockup svg{width:150px;height:150px;flex:none}
  .kata{font:800 112px/1 Archivo;letter-spacing:-.025em}
  .gelap .kata{color:#2C3459}  .terang .kata{color:#F6F4DD}
  .mark-only{display:inline-block;padding:24px}
  .mark-only svg{width:400px;height:400px}
</style></head>
<body>
<template id="mark">
  <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fajarG" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="#E75E19"/><stop offset="1" stop-color="#ECA912"/>
      </linearGradient>
      <!-- garis cakrawala: celah horizontal yang memotong matahari -->
      <mask id="garis"><rect width="120" height="120" fill="#fff"/>
        <rect x="0" y="55" width="120" height="4" fill="#000"/>
        <rect x="0" y="65" width="120" height="3.5" fill="#000"/>
      </mask>
    </defs>
    <!-- matahari terbit -->
    <path d="M18 74 A42 42 0 0 1 102 74 Z" fill="url(#fajarG)" mask="url(#garis)"/>
    <!-- buku terbuka = garis cakrawala -->
    <path class="hal-kiri"  d="M60 82 C44 74 26 73 8 77 V97 C26 93 44 94 60 102 Z"/>
    <path class="hal-kanan" d="M60 82 C76 74 94 73 112 77 V97 C94 93 76 94 60 102 Z"/>
  </svg>
</template>
<div id="out"></div>
<script>
  const v=new URLSearchParams(location.search).get('v')||'gelap';
  const m=document.getElementById('mark').innerHTML;
  const kiri = v==='terang' ? '#F6F4DD' : '#2C3459';
  const kanan= v==='terang' ? '#AAB8C9' : '#445574';
  const out=document.getElementById('out');
  out.innerHTML = v==='ikon'
    ? `<div class="mark-only">${m}</div>`
    : `<div class="lockup ${v}">${m}<span class="kata">cakrawala</span></div>`;
  out.querySelector('.hal-kiri').setAttribute('fill', v==='ikon' ? '#2C3459' : kiri);
  out.querySelector('.hal-kanan').setAttribute('fill', v==='ikon' ? '#445574' : kanan);
</script>
</body></html>
